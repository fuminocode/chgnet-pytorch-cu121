[project]
name = "lisuperionic-structure"
version = "0.1.0"
description = "Occupancy-aware CGCNN baseline for experimental Li conductivity"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pymatgen==2023.11.12",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
]

[project.optional-dependencies]
cpu = ["torch==2.5.1"]
cu121 = ["torch==2.5.1"]
dev = ["pytest==8.3.5"]
chgnet = [
  "chgnet==0.3.8",
  "ase==3.23.0",
  "Cython==3.0.12",
  "nvidia-ml-py3==7.352.0",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu121" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cu121" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
